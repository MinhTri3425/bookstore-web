<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${book.id == null ? 'Thêm Sách Mới' : 'Sửa Sách'} + ' - Admin'"></title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/admin/dashboard">
                <i class="fas fa-cog"></i> Admin Panel
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/admin/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/admin/books">Quản lý sách</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-md-3">
                <div class="card shadow-sm">
                    <div class="card-header bg-white"><h5 class="mb-0">Menu Quản lý</h5></div>
                    <div class="list-group list-group-flush">
                        <a href="/admin/dashboard" class="list-group-item list-group-item-action"><i class="fas fa-tachometer-alt me-2"></i>Dashboard</a>
                        <a href="/admin/books" class="list-group-item list-group-item-action active"><i class="fas fa-book me-2"></i>Quản lý sách</a>
                        <a href="/admin/authors" class="list-group-item list-group-item-action"><i class="fas fa-user me-2"></i>Tác giả</a>
                        <a href="/admin/categories" class="list-group-item list-group-item-action"><i class="fas fa-tags me-2"></i>Danh mục</a>
                    </div>
                </div>
            </div>

            <div class="col-md-9">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 th:text="${book.id == null ? 'Thêm Sách Mới' : 'Chỉnh Sửa Sách'}"></h2>
                    <a href="/admin/books" class="btn btn-outline-secondary"><i class="fas fa-arrow-left"></i> Quay lại</a>
                </div>

                <form class="book-form" method="post" th:action="@{/admin/books/save}" enctype="multipart/form-data">
                    <input type="hidden" name="id" th:value="${book.id}">
                    
                    <div class="row">
                        <div class="col-lg-8">
                            <div class="card shadow-sm mb-4">
                                <div class="card-header bg-light"><h5 class="mb-0">Thông Tin Cơ Bản</h5></div>
                                <div class="card-body">
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Tiêu Đề <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control form-control-lg" id="title" name="title" 
                                               th:value="${book.title}" placeholder="Nhập tiêu đề sách" required>
                                    </div>

                                    <div class="row g-3 mb-3">
                                        <div class="col-md-6">
                                            <label class="form-label fw-bold">ISBN <span class="text-danger">*</span></label>
                                            <input type="text" class="form-control" name="isbn" th:value="${book.isbn}" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label fw-bold">Tác Giả <span class="text-danger">*</span></label>
                                            <select class="form-select" id="authorSelect" name="authorId" required>
                                                <option value="" disabled th:selected="${book.authorId == null}">Chọn tác giả</option>
                                                <option th:each="a : ${authors}" th:value="${a.id}" th:text="${a.name}" 
                                                        th:selected="${a.id == book.authorId}"></option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Danh Mục <span class="text-danger">*</span></label>
                                        <select class="form-select" name="categoryId" required>
                                            <option value="" disabled th:selected="${book.categoryId == null}">Chọn danh mục</option>
                                            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" 
                                                    th:selected="${c.id == book.categoryId}"></option>
                                        </select>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Mô Tả</label>
                                        <textarea class="form-control" name="description" rows="4" th:text="${book.description}"></textarea>
                                    </div>
                                </div>
                            </div>

                            <div class="card shadow-sm mb-4">
                                <div class="card-header bg-light"><h5 class="mb-0">Giá & Tồn Kho</h5></div>
                                <div class="card-body">
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label class="form-label fw-bold">Giá Bán (₫) <span class="text-danger">*</span></label>
                                            <input type="number" class="form-control" id="priceInput" name="price" 
                                                   th:value="${book.price}" step="1000" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label fw-bold">Tồn Kho <span class="text-danger">*</span></label>
                                            <input type="number" class="form-control" name="stock" 
                                                   th:value="${book.stock != null ? book.stock : 0}" required>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="card shadow-sm mb-4">
                                <div class="card-header bg-light"><h5 class="mb-0">Hình Ảnh</h5></div>
                                <div class="card-body text-center">
                                    <label class="form-label fw-bold d-block text-start">Ảnh Bìa <span th:if="${book.id == null}" class="text-danger">*</span></label>
                                    <div class="upload-area border-2 border-dashed p-4 rounded" id="uploadArea" style="cursor: pointer; background: #f8f9fa;">
                                        <i class="fas fa-cloud-upload-alt fa-2x text-muted mb-2"></i>
                                        <p class="mb-0">Click hoặc kéo thả ảnh vào đây</p>
                                        <input type="file" id="coverImage" name="coverImage" accept="image/*" style="display: none;" th:required="${book.id == null}">
                                    </div>
                                    <small class="text-muted mt-2 d-block" th:if="${book.id != null}">Để trống nếu muốn giữ ảnh cũ</small>
                                </div>
                            </div>

                            <div class="d-flex gap-2 mb-5">
                                <button type="submit" class="btn btn-primary btn-lg px-5"><i class="fas fa-save me-2"></i>Lưu Sách</button>
                                <a href="/admin/books" class="btn btn-light btn-lg">Hủy</a>
                            </div>
                        </div>

                        <div class="col-lg-4">
                            <div class="card shadow-sm sticky-top" style="top: 20px;">
                                <div class="card-header bg-white"><strong>Xem trước hiển thị</strong></div>
                                <div class="card-body text-center">
                                    <div id="previewCoverContainer" class="mb-3 bg-light rounded d-flex align-items-center justify-content-center" style="height: 250px; overflow: hidden;">
                                        <i class="fas fa-book fa-4x text-light-emphasis"></i>
                                    </div>
                                    <h5 id="previewTitle" class="text-truncate">Tiêu đề sách</h5>
                                    <p id="previewAuthor" class="text-muted small">Tên tác giả</p>
                                    <h4 id="previewPrice" class="text-danger fw-bold">0 ₫</h4>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const fileInput = document.getElementById('coverImage');
        const uploadArea = document.getElementById('uploadArea');
        const priceInput = document.getElementById('priceInput');
        const titleInput = document.getElementById('title');
        const authorSelect = document.getElementById('authorSelect');

        // Trigger file click
        uploadArea.onclick = () => fileInput.click();

        // Image Preview Logic
        fileInput.onchange = function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('previewCoverContainer').innerHTML = 
                        `<img src="${e.target.result}" style="width: 100%; height: 100%; object-fit: cover;">`;
                };
                reader.readAsDataURL(file);
            }
        };

        // Live Text Preview
        titleInput.oninput = function() {
            document.getElementById('previewTitle').innerText = this.value || 'Tiêu đề sách';
        };

        priceInput.oninput = function() {
            const val = parseInt(this.value) || 0;
            document.getElementById('previewPrice').innerText = val.toLocaleString('vi-VN') + ' ₫';
        };

        authorSelect.onchange = function() {
            const text = this.options[this.selectedIndex].text;
            document.getElementById('previewAuthor').innerText = text;
        };

        // Init values on Load (for Edit mode)
        window.onload = () => {
            if(titleInput.value) titleInput.oninput();
            if(priceInput.value) priceInput.oninput();
            if(authorSelect.selectedIndex > 0) authorSelect.onchange();
        };
    </script>
</body>
</html>
